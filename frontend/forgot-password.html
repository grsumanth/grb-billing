<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Reset Password — GRB Billing</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Baloo+2:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<style>
:root{
  --burg:#780116;--burg2:#9B0A20;--burg3:#5C0011;--burg4:#3D000B;
  --gold:#C9A84C;--gold2:#F0CC6A;
  --cream:#FFFFFF;--cream2:#F1F5F9;--cream3:#E2E8F0;
  --bg:#F8FAFC;--text:#0F172A;--muted:#475569;
  --font:'Baloo 2',cursive;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font);background:var(--bg);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem;}
.box{width:100%;max-width:400px;background:white;border-radius:24px;box-shadow:0 0 0 1px var(--cream3), 0 10px 40px rgba(120,1,22,0.06);border-top:4px solid var(--burg);overflow:hidden;}
.hdr{background:linear-gradient(135deg,var(--burg4),var(--burg));padding:24px 28px;text-align:center;}
.logo{width:52px;height:52px;margin:0 auto 10px;background:rgba(255,255,255,0.1);border:2px solid rgba(201,168,76,0.4);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.8rem;}
.title{font-family:'Cinzel Decorative',serif;font-size:1rem;color:var(--gold2);}
.sub{font-size:.72rem;color:rgba(201,168,76,0.6);margin-top:3px;text-transform:uppercase;letter-spacing:1.2px;}
.body{padding:1.6rem 1.8rem 2rem;}
.step{display:none;}.step.on{display:block;}
.field{margin-bottom:1rem;}
.field label{display:block;font-size:.7rem;font-weight:700;color:var(--burg3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:.32rem;}
.field input{width:100%;padding:.72rem 1rem;border:2px solid var(--cream3);border-radius:10px;font-family:var(--font);font-size:16px;color:var(--text);background:var(--cream);outline:none;transition:all .22s;}
.field input:focus{border-color:var(--burg);background:white;box-shadow:0 0 0 3px rgba(120,1,22,0.08);}
.btn{width:100%;padding:.82rem;margin-top:.4rem;background:linear-gradient(135deg,var(--burg3),var(--burg),var(--burg2));color:white;border:none;border-radius:11px;font-family:var(--font);font-size:1rem;font-weight:800;cursor:pointer;transition:all .22s;box-shadow:0 4px 16px rgba(120,1,22,0.3);min-height:48px;}
.btn:hover{transform:translateY(-1px);}
.btn:disabled{opacity:.7;cursor:not-allowed;transform:none;}
.msg{padding:.65rem .9rem;border-radius:9px;font-size:.85rem;font-weight:600;margin-bottom:1rem;display:none;}
.msg.error{background:#fff0f0;color:#cc2222;border:1px solid #ffcccc;display:block;}
.msg.success{background:#f0fff0;color:#1a6b1a;border:1px solid #b3e6b3;display:block;}
.back{display:block;text-align:center;margin-top:1rem;color:var(--muted);font-size:.85rem;text-decoration:none;font-weight:600;}
.back:hover{color:var(--burg);}
.otp-hint{font-size:.78rem;color:var(--muted);text-align:center;margin-bottom:.8rem;}
</style>
</head>
<body>
<div class="box">
  <div class="hdr">
    <div class="logo">ॐ</div>
    <div class="title">Reset Password</div>
    <div class="sub">GRB Pooja Items</div>
  </div>
  <div class="body">

    <!-- Step 1: Enter Email -->
    <div class="step on" id="step1">
      <div class="msg" id="msg1"></div>
      <div class="field">
        <label>Your Email Address</label>
        <input type="email" id="fp-email" placeholder="you@example.com" inputmode="email"/>
      </div>
      <button class="btn" id="btn-send-otp" onclick="sendOtp()">Send OTP</button>
      <a href="index.html" id="link-back-to-login" class="back">← Back to Login</a>
    </div>

    <!-- Step 2: Enter OTP -->
    <div class="step" id="step2">
      <div class="msg" id="msg2"></div>
      <p class="otp-hint">Enter the 6-digit OTP sent to your email</p>
      <div class="field">
        <label>OTP Code</label>
        <input type="text" id="fp-otp" placeholder="Enter 6-digit OTP" maxlength="6" inputmode="numeric"/>
      </div>
      <button class="btn" id="btn-verify-otp" onclick="verifyOtp()">Verify OTP</button>
      <a href="#" id="link-change-email" class="back" onclick="goStep(1)">← Enter different email</a>
    </div>

    <!-- Step 3: New Password -->
    <div class="step" id="step3">
      <div class="msg" id="msg3"></div>
      <div class="field">
        <label>New Password</label>
        <input type="password" id="fp-newpass" placeholder="Min 6 characters"/>
      </div>
      <div class="field">
        <label>Confirm Password</label>
        <input type="password" id="fp-confirmpass" placeholder="Re-enter password"/>
      </div>
      <button class="btn" id="btn-reset-password-submit" onclick="resetPass()">Reset Password</button>
    </div>

    <!-- Step 4: Success -->
    <div class="step" id="step4">
      <div style="text-align:center;padding:1rem 0;">
        <div style="font-size:3rem;margin-bottom:1rem;">✅</div>
        <div style="font-size:1.1rem;font-weight:800;color:var(--burg);margin-bottom:.5rem;">Password Reset!</div>
        <div style="color:var(--muted);font-size:.88rem;margin-bottom:1.5rem;">Your password has been updated successfully.</div>
        <a href="index.html" id="link-go-to-login"><button class="btn" id="btn-go-to-login">Go to Login</button></a>
      </div>
    </div>

  </div>
</div>

<script src="config.js"></script>
<script>
let fpEmail = '';

function goStep(n){
  document.querySelectorAll('.step').forEach(s=>s.classList.remove('on'));
  document.getElementById('step'+n).classList.add('on');
}

function showMsg(id, text, type){
  const el=document.getElementById(id);
  el.textContent=text; el.className='msg '+type;
}

async function sendOtp(){
  fpEmail = document.getElementById('fp-email').value.trim();
  if(!fpEmail){ showMsg('msg1','Please enter your email.','error'); return; }
  const btn=document.querySelector('#step1 .btn');
  btn.textContent='Sending...'; btn.disabled=true;
  try{
    const res=await fetch(API_BASE + '/api/email/forgot-password',{
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({email:fpEmail})
    });
    const data=await res.json();
    if(!res.ok){ showMsg('msg1',data.error,'error'); return; }
    goStep(2);
  }catch(e){ showMsg('msg1','Connection error. Try again.','error'); }
  finally{ btn.textContent='Send OTP'; btn.disabled=false; }
}

async function verifyOtp(){
  const otp=document.getElementById('fp-otp').value.trim();
  if(!otp){ showMsg('msg2','Please enter the OTP.','error'); return; }
  const btn=document.querySelector('#step2 .btn');
  btn.textContent='Verifying...'; btn.disabled=true;
  try{
    const res=await fetch(API_BASE + '/api/email/verify-otp',{
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({email:fpEmail, otp})
    });
    const data=await res.json();
    if(!res.ok){ showMsg('msg2',data.error,'error'); return; }
    goStep(3);
  }catch(e){ showMsg('msg2','Connection error. Try again.','error'); }
  finally{ btn.textContent='Verify OTP'; btn.disabled=false; }
}

async function resetPass(){
  const newPass=document.getElementById('fp-newpass').value;
  const confirm=document.getElementById('fp-confirmpass').value;
  if(!newPass||!confirm){ showMsg('msg3','Please fill both fields.','error'); return; }
  if(newPass.length<6){ showMsg('msg3','Password must be at least 6 characters.','error'); return; }
  if(newPass!==confirm){ showMsg('msg3','Passwords do not match.','error'); return; }
  const otp=document.getElementById('fp-otp').value.trim();
  const btn=document.querySelector('#step3 .btn');
  btn.textContent='Resetting...'; btn.disabled=true;
  try{
    const res=await fetch(API_BASE + '/api/email/reset-password',{
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({email:fpEmail, otp, newPassword:newPass})
    });
    const data=await res.json();
    if(!res.ok){ showMsg('msg3',data.error,'error'); return; }
    goStep(4);
  }catch(e){ showMsg('msg3','Connection error. Try again.','error'); }
  finally{ btn.textContent='Reset Password'; btn.disabled=false; }
}
</script>
</body>
</html>
